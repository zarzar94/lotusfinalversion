<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Content Security Policy -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self';" />
    <!-- Prevent clickjacking -->
    <title>مختبر الصوت • برنامج بيرارد (Berard AIT) | Lotus</title>
    <meta name="description" content="موقع عربي تفاعلي (React) لبرنامج بيرارد AIT داخل Lotus Holistic Centre — ألعاب سمعية، عارض شرائح، قائمة تحقق، مقارنة البدائل، ومحتوى مدرسي." />
    <meta name="theme-color" content="#774E87" />
    <link rel="icon" type="image/png" href="%BASE_URL%assets/images/brain_icon_44.png" />
    <!-- DNS prefetch and preconnect for faster font loading -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    <link rel="dns-prefetch" href="https://fonts.gstatic.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Preload critical font for faster first paint -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" as="style">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Preload hero image for faster LCP -->
    <link rel="preload" href="%BASE_URL%assets/images/brain_logo.png" as="image">
    <style>
      /* Critical CSS inline for faster first paint */
      *, *::before, *::after { font-family: 'Cairo', system-ui, sans-serif; box-sizing: border-box; }
      body { font-family: 'Cairo', system-ui, sans-serif; margin: 0; background: #050610; }
      #root { min-height: 100vh; }
    </style>
    <!-- jsPDF loaded via npm package, no CDN needed -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

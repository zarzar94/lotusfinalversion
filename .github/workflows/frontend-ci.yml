name: Frontend CI/CD

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - 'backend/**'
      - '*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'backend/**'

env:
  NODE_VERSION: '20'

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # BUILD AND TEST
  # ═══════════════════════════════════════════════════════════════════════════
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run type check
        run: npx tsc --noEmit
        continue-on-error: true

      - name: Run unit tests
        run: npm run test:run --if-present

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        if: success()
        with:
          directory: coverage
          flags: frontend

      - name: Build application
        run: npm run build
        env:
          VITE_CLINIC_PHONE: ${{ secrets.VITE_CLINIC_PHONE || '+966500000000' }}
          VITE_API_URL: ${{ vars.VITE_API_URL || '/api' }}

      - name: Run QA checks
        run: npm run qa:assets

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  # ═══════════════════════════════════════════════════════════════════════════
  # E2E TESTS
  # ═══════════════════════════════════════════════════════════════════════════
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 30

  # ═══════════════════════════════════════════════════════════════════════════
  # DEPLOY TO GITHUB PAGES
  # ═══════════════════════════════════════════════════════════════════════════
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: [build, e2e]
    if: github.ref == 'refs/heads/main'

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ═══════════════════════════════════════════════════════════════════════════
  # LIGHTHOUSE AUDIT
  # ═══════════════════════════════════════════════════════════════════════════
  lighthouse:
    name: Lighthouse Audit
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Lighthouse
        uses: treosh/lighthouse-ci-action@v10
        with:
          urls: |
            ${{ vars.SITE_URL || 'https://example.github.io/lotusfinalversion/' }}
          uploadArtifacts: true
          temporaryPublicStorage: true

  # ═══════════════════════════════════════════════════════════════════════════
  # BUNDLE SIZE CHECK
  # ═══════════════════════════════════════════════════════════════════════════
  bundle-size:
    name: Bundle Size
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Check bundle size
        run: |
          echo "📦 Bundle Size Report"
          echo "====================="
          du -sh dist/
          echo ""
          echo "JavaScript bundles:"
          find dist -name "*.js" -exec ls -lh {} \; | awk '{print $5, $9}'
          echo ""
          echo "CSS bundles:"
          find dist -name "*.css" -exec ls -lh {} \; | awk '{print $5, $9}'
